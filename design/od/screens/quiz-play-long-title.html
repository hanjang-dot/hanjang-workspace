<!DOCTYPE html>

<head>

<title>한장 — quiz-play</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">

</head>
<body>
<main class="screen"><header class="nav-header"><button class="icon-button icon-button-md" aria-label="뒤로"><svg class="icon" data-icon="chevron-left" width="24" height="24"><use href="../icons.svg#i-chevron-left"/></svg></button><div class="nav-header-center"><span class="t-label">3 / 10</span></div><h1 class="nav-header-title t-h3">영단어 퀴즈</h1><div class="nav-header-actions"><button class="icon-button icon-button-md" aria-label="나가기"><svg class="icon" data-icon="door-open" width="24" height="24"><use href="../icons.svg#i-door-open"/></svg></button></div></header><div class="screen-body screen-body--has-cta"><div class="progress-bar"><div class="progress-bar-fill"></div></div><div class="card"><span class="t-caption">EN → KO</span><h2 class="card-title t-h1">"apple"을 뜻하는 것은?</h2><p class="card-desc t-body-sm">다음 중 알맞은 뜻을 고르세요</p></div><div class="choice-list"><button class="choice"><span class="choice-index t-label">1</span><span class="choice-text t-body">바나나</span></button><button class="choice is-correct"><span class="choice-index t-label">2</span><span class="choice-text t-body">사과</span><span class="choice-mark">✓ 정답</span></button><button class="choice"><span class="choice-index t-label">3</span><span class="choice-text t-body">포도</span></button><button class="choice"><span class="choice-index t-label">4</span><span class="choice-text t-body">복숭아</span></button><button class="choice"><span class="choice-index t-label">5</span><span class="choice-text t-body">귤</span></button><button class="choice"><span class="choice-index t-label">6</span><span class="choice-text t-body">수박</span></button></div><div class="tf-row"><button class="tf-button is-correct">O</button><button class="tf-button">X</button></div><div class="card"><div class="card-row"><div><h2 class="card-title t-body">아주 긴 제목의 시험지 카드 예시 텍스트입니다 정말로 깁니다</h2></div></div></div></div><div class="bottom-cta"><button class="button button-primary button-lg button-full">다음 문제</button></div></main>
</body>
