<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 320">
  <rect width="358" height="320" fill="#FFFFFF"/>
  <text x="0" y="20" font-size="13" fill="#8B87A3" font-family="serif">2025학년도 수능 국어 · 32번</text>
  <g font-size="15" fill="#17142B" font-family="'Noto Serif KR',serif">
    <text x="0" y="56">인간은 오래전부터 이야기를 통해 세계를</text>
    <text x="0" y="82">이해해 왔다. 서사는 흩어진 사건들에 인과의</text>
    <text x="0" y="108">실을 꿰어 의미의 질서를 부여하는 방식이다.</text>
    <text x="0" y="134">독자는 서사 속 사건의 연결을 따라가며 경험을</text>
    <text x="0" y="160">재구성하고, 그 과정에서 세계를 해석하는 틀을</text>
    <text x="0" y="186">얻는다. 따라서 서사는 단순한 오락이 아니라</text>
    <text x="0" y="212">인간이 실재를 이해하는 기본 장치로 작동한다.</text>
    <text x="0" y="250">다만 서사가 부여하는 인과는 실제 사건의</text>
    <text x="0" y="276">인과와 다를 수 있다. 서사적 질서는 선택과</text>
    <text x="0" y="302">배제의 결과이므로, 독자는 그 질서를 검토하는</text>
  </g>
  <rect x="0" y="112" width="75" height="3" rx="1.5" fill="#6C5CE7"/>
  <rect x="135" y="190" width="165" height="3" rx="1.5" fill="#6C5CE7"/>
</svg>
