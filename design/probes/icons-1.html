<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한장 — 아이콘 매핑 (lucide)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EBDD;--card:#FBF6EC;--ink:#1A1612;--muted:#7A7166;
    --rule:#C9BBA3;--stamp:#C4563A;--navy:#1E3A5F;--hairline:#E4D8C4;
    --frame-w:390px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,sans-serif;padding:28px 24px 90px}
  .page{max-width:1100px;margin:0 auto}
  h1{font-family:"Noto Serif KR",serif;font-size:22px}
  .sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.6}
  .reco-line{margin-top:12px;font-size:13.5px}
  .reco-line b{color:var(--stamp)}
  .topbar{display:flex;align-items:center;gap:14px;margin:20px 0 6px;flex-wrap:wrap}
  #allBtn{background:var(--navy);color:var(--card);border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-family:inherit;cursor:pointer}
  #allBtn.done{background:var(--stamp)}
  .hint{font-size:12px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px}
  .icard{background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .15s;position:relative}
  .icard:hover{border-color:var(--rule)}
  .icard.open{border-color:var(--navy)}
  .num{position:absolute;top:12px;right:14px;color:var(--stamp);font-weight:700;font-size:14px}
  .icard svg{width:30px;height:30px;color:var(--ink);display:block}
  .icard b{display:block;font-size:14px;margin-top:12px}
  .icard code{font-size:11.5px;color:var(--navy);background:var(--paper);border:1px solid var(--hairline);border-radius:6px;padding:1px 7px;display:inline-block;margin-top:4px}
  .icard p{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .alts{display:none;margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule)}
  .icard.open .alts{display:block}
  .alts em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-bottom:8px}
  .alt{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 11px;font-size:11.5px;font-family:inherit;color:var(--ink);cursor:pointer;margin:0 5px 5px 0}
  .alt:hover{border-color:var(--navy)}
  .alt.sel{background:var(--navy);color:var(--card);border-color:var(--navy)}
  .alts .mine{font-size:11px;color:var(--muted)}
  .alts .mine.sel{color:var(--stamp);font-weight:700}
  .frame-note{margin-top:34px;padding:16px;border:1px dashed var(--rule);border-radius:12px;width:var(--frame-w);font-size:12px;color:var(--muted);line-height:1.7}
  .frame-note b{color:var(--ink)}
</style>
</head>
<body>
<div class="page">
<header>
  <h1>한장 아이콘 매핑 — lucide</h1>
  <p class="sub">화면에 들어갈 액션·상태마다 lucide 아이콘 하나씩을 추천안으로 골랐습니다. 카드를 누르면 대안 2개가 열리고, 눌러서 바꿀 수 있습니다.</p>
  <p class="reco-line"><b>추천:</b> 전부 stroke 1.8px의 lucide — 시험지 위 잉크 선·밑줄 펜과 결이 맞습니다.</p>
</header>
<div class="topbar">
  <button id="allBtn">전체 추천대로 할게요</button>
  <span class="hint">또는 카드를 하나씩 열어 대안을 고르세요.</span>
</div>
<div class="grid" id="grid"></div>
<div class="frame-note"><b>규칙</b> — 아이콘은 채움 없이 선만, 굵기 1.8px, 크기 20~24px. 정답·오답처럼 채점에 쓰는 것만 도장 빨강(--stamp)과 네이비(--navy)를 섞어 씁니다.</div>
</div>

<script>
const db=(()=>{try{if(window.claude&&claude.use)return claude.use("db")}catch(e){}return null})();const saveFb=(k,v)=>{try{db?db.put(`feedback/${k}`,v):localStorage.setItem(`feedback/${k}`,JSON.stringify(v))}catch(e){}};
const ICONS=[
 {num:'①',ko:'홈',name:'home',use:'하단 탭 — 첫 화면으로 이동',alts:['house','layout-grid'],
  svg:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>'},
 {num:'②',ko:'자료실',name:'library',use:'하단 탭 — 모의고사·기출 보관함',alts:['book-open','folder'],
  svg:'<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>'},
 {num:'③',ko:'저장',name:'bookmark',use:'하단 탭 — 북마크한 시험지·문항',alts:['book-marked','flag'],
  svg:'<path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>'},
 {num:'④',ko:'복습',name:'history',use:'하단 탭 — 풀이 기록·다시 풀기',alts:['rotate-ccw','clock'],
  svg:'<path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>'},
 {num:'⑤',ko:'마이',name:'user',use:'하단 탭 — 내 정보·설정',alts:['circle-user-round','settings'],
  svg:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'},
 {num:'⑥',ko:'이어하기',name:'play',use:'홈 카드 — 중단한 시험 재개',alts:['circle-play','arrow-right'],
  svg:'<path d="m6 3 14 9-14 9V3z"/>'},
 {num:'⑦',ko:'밑줄 펜',name:'highlighter',use:'시험지 — 지문 위 밑줄 그리기',alts:['pen-line','pencil'],
  svg:'<path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4z"/>'},
 {num:'⑧',ko:'타이머',name:'timer',use:'시험지 상단 — 남은 시간 표시',alts:['alarm-clock','hourglass'],
  svg:'<line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>'},
 {num:'⑨',ko:'정답',name:'check',use:'채점 — 맞은 문항 표시',alts:['circle-check','badge-check'],
  svg:'<path d="M20 6 9 17l-5-5"/>'},
 {num:'⑩',ko:'오답',name:'x',use:'채점 — 틀린 문항 표시',alts:['circle-x','ban'],
  svg:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'},
 {num:'⑪',ko:'결과',name:'bar-chart-3',use:'성적표·학습 리포트 화면',alts:['chart-pie','trending-up'],
  svg:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>'},
 {num:'⑫',ko:'로그아웃',name:'log-out',use:'마이 — 계정 로그아웃',alts:['door-open','power'],
  svg:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>'},
 {num:'⑬',ko:'북마크 토글',name:'star',use:'자료실 카드 — 즐겨찾기 켜기·끄기',alts:['bookmark','heart'],
  svg:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'},
 {num:'⑭',ko:'닫기·뒤로',name:'chevron-left',use:'스택 화면 — 이전으로 닫기',alts:['arrow-left','x'],
  svg:'<path d="m15 18-6-6 6-6"/>'}
];
const grid=document.getElementById('grid');
ICONS.forEach(ic=>{
  const d=document.createElement('div');
  d.className='icard';d.dataset.name=ic.name;
  d.innerHTML=`<span class="num">${ic.num}</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic.svg}</svg>
    <b>${ic.ko}</b><code>${ic.name}</code><p>${ic.use}</p>
    <div class="alts"><em>대안을 누르면 바뀝니다 · 추천안: ${ic.name}</em>
      <button class="alt mine sel" data-a="${ic.name}">${ic.name} (추천)</button>
      ${ic.alts.map(a=>`<button class="alt" data-a="${a}">${a}</button>`).join('')}
    </div>`;
  d.addEventListener('click',e=>{
    const chip=e.target.closest('.alt');
    if(chip){
      d.querySelectorAll('.alt').forEach(c=>c.classList.toggle('sel',c===chip));
      saveFb(`icon-${ic.name}`,chip.dataset.a);
      e.stopPropagation();
      return;
    }
    d.classList.toggle('open');
  });
  grid.appendChild(d);
});
document.getElementById('allBtn').addEventListener('click',e=>{
  saveFb('icons-all','recommended');
  const b=e.currentTarget;b.classList.add('done');b.textContent='추천안으로 저장했어요';
});
</script>
</body>
</html>
